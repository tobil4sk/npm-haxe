on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        runner: [windows-latest, macos-15-intel, ubuntu-latest]
        node-version: [lts/-2, lts/-1, latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name:  Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm test
        name: Run test
